[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bencheval"
version = "0.1.0"
description = "Instruction-aware benchmark runner for LLMs and coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
dependencies = [
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7",
  "jsonschema>=4.23,<5",
  "typer>=0.16,<1",
]

[project.scripts]
bencheval = "bencheval.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.13,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: opt-in Codex calls consuming subscription usage"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/bencheval"]
